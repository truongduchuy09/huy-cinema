<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ʜᴜʏ ᴄɪɴᴇᴍᴀ</title>
    <link rel="icon" type="image/png" href="logo.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(229, 9, 20, 0.22), transparent 50%),
                radial-gradient(circle at 100% 60%, rgba(180, 10, 20, 0.1), transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(229, 9, 20, 0.08), transparent 45%);
            background-attachment: fixed;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #08080c; }
        ::-webkit-scrollbar-thumb { background: #22222e; border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: #e50914; }

        .glass-header {
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .glass-panel {
            background: rgba(15, 15, 22, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.8);
        }

        .vip-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .vip-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(229, 9, 20, 0.6);
            box-shadow: 0 15px 30px -10px rgba(229, 9, 20, 0.4);
        }

        .vip-btn-primary {
            background: linear-gradient(135deg, #e50914 0%, #b91c1c 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: all 0.2s ease;
        }

        .vip-btn-primary:active { transform: scale(0.95); }

        .vip-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.2s ease;
        }

        .vip-btn-secondary:hover {
            background: rgba(229, 9, 20, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .red-glow-text {
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.7);
        }

        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.65; }
        }
        .animate-skeleton { animation: skeletonPulse 1.8s ease-in-out infinite; }
    </style>
</head>
<body class="text-gray-100 min-h-screen antialiased selection:bg-red-600 selection:text-white">

    <!-- HEADER NAVIGATION -->
    <header class="glass-header sticky top-0 z-50 transition-all duration-300">
        <div class="container mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            
            <div class="flex items-center gap-3 cursor-pointer select-none group" onclick="goHome()">
                <div class="w-9 h-9 rounded-2xl overflow-hidden flex items-center justify-center shadow-[0_0_15px_rgba(229,9,20,0.7)] group-hover:scale-105 transition border border-white/30 bg-black">
                    <img src="logo.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-red-600 via-red-500 to-rose-400 red-glow-text">
                    ʜᴜʏ ᴄɪɴᴇᴍᴀ
                </span>
            </div>

            <div class="w-full sm:w-80 relative flex items-center">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Tìm kiếm phim, diễn viên..." 
                    class="w-full bg-white/[0.05] border border-white/10 rounded-full pl-4 pr-16 py-2 text-xs text-white placeholder-gray-400 focus:outline-none focus:border-red-500 transition"
                >
                <button 
                    onclick="searchMovie()" 
                    class="absolute right-1 top-1 bottom-1 vip-btn-primary px-4 rounded-full text-xs font-bold text-white"
                >
                    Tìm
                </button>
            </div>
        </div>

        <nav class="border-t border-white/[0.06] bg-black/30">
            <div class="container mx-auto px-4 flex overflow-x-auto gap-2 py-2.5 scrollbar-hide text-xs font-bold">
                <button onclick="selectCategory('all')" id="cat-all" class="cat-btn vip-btn-primary text-white px-4 py-2 rounded-full whitespace-nowrap shrink-0">Mới Cập Nhật</button>
                <button onclick="selectCategory('phim-bo')" id="cat-phim-bo" class="cat-btn vip-btn-secondary text-gray-300 px-4 py-2 rounded-full whitespace-nowrap shrink-0">Phim Bộ</button>
                <button onclick="selectCategory('phim-le')" id="cat-phim-le" class="cat-btn vip-btn-secondary text-gray-300 px-4 py-2 rounded-full whitespace-nowrap shrink-0">Phim Lẻ</button>
                <button onclick="selectCategory('hoat-hinh')" id="cat-hoat-hinh" class="cat-btn vip-btn-secondary text-gray-300 px-4 py-2 rounded-full whitespace-nowrap shrink-0">Hoạt Hình</button>
                <button onclick="selectCategory('tv-shows')" id="cat-tv-shows" class="cat-btn vip-btn-secondary text-gray-300 px-4 py-2 rounded-full whitespace-nowrap shrink-0">TV Shows</button>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-3 sm:px-4 py-6">
        
        <!-- PLAYER SECTION -->
        <section id="playerSection" class="hidden mb-10 glass-panel p-4 sm:p-6 rounded-3xl relative overflow-hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-red-600 animate-ping"></span>
                    <h2 id="playingTitle" class="text-sm sm:text-lg font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-500 truncate">
                        Đang tải phim...
                    </h2>
                </div>
                
                <div class="flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-end">
                    <button id="togglePlayerBtn" onclick="togglePlayerMode()" class="vip-btn-secondary text-[11px] px-3 py-1.5 rounded-full font-bold text-yellow-400 border border-yellow-500/30">
                        Chế độ: VIP Player (HLS)
                    </button>
                    <button onclick="closePlayer()" class="vip-btn-secondary text-gray-300 text-[11px] px-3.5 py-1.5 rounded-full font-bold">
                        Đóng [X]
                    </button>
                </div>
            </div>

            <div id="playerContainer" class="aspect-video w-full max-w-5xl mx-auto bg-black rounded-2xl overflow-hidden border border-white/10 shadow-2xl">
                <video id="videoPlayer" controls class="w-full h-full"></video>
                <iframe id="iframePlayer" class="w-full h-full hidden" frameborder="0" allowfullscreen></iframe>
            </div>
            
            <div class="mt-6 space-y-5 max-w-5xl mx-auto">
                <div id="serverContainer">
                    <h3 class="font-bold text-gray-400 text-xs uppercase tracking-wider mb-2.5">Chọn Nguồn Phát (Server):</h3>
                    <div id="serverList" class="flex flex-wrap gap-2"></div>
                </div>

                <div>
                    <h3 class="font-bold text-gray-400 text-xs uppercase tracking-wider mb-2.5">Danh Sách Tập Phim:</h3>
                    <div id="episodeList" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1 scrollbar-hide"></div>
                </div>
            </div>
        </section>

        <!-- LỊCH SỬ XEM PHIM -->
        <section id="historySection" class="hidden mb-8">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-5 bg-red-600 rounded-full shadow-[0_0_12px_rgba(229,9,20,0.9)]"></div>
                    <h2 class="text-sm font-extrabold tracking-wide text-gray-200">TIẾP TỤC XEM</h2>
                </div>
                <button onclick="clearHistory()" class="text-[11px] text-gray-400 hover:text-red-400 font-semibold">[Xóa lịch sử]</button>
            </div>
            <div id="historyGrid" class="flex overflow-x-auto gap-4 pb-3 scrollbar-hide snap-x"></div>
        </section>

        <div class="flex items-center gap-2.5 mb-5">
            <div class="w-1.5 h-6 bg-red-600 rounded-full shadow-[0_0_12px_rgba(229,9,20,0.9)]"></div>
            <h2 id="sectionTitle" class="text-base font-black tracking-wider text-gray-100 uppercase">
                Phim Mới Cập Nhật
            </h2>
        </div>

        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5 sm:gap-6"></div>

        <div id="pagination" class="flex justify-center items-center gap-3 mt-10">
            <button id="prevBtn" onclick="changePage(-1)" class="vip-btn-secondary px-4 py-2 rounded-full text-xs font-bold disabled:opacity-20">
                &larr; Trước
            </button>
            <span id="pageCurrent" class="text-xs font-black px-4 py-2 rounded-full text-red-400 bg-white/5 border border-white/10">
                Trang 1 / 1
            </span>
            <button id="nextBtn" onclick="changePage(1)" class="vip-btn-secondary px-4 py-2 rounded-full text-xs font-bold disabled:opacity-20">
                Sau &rarr;
            </button>
        </div>
    </main>

    <footer class="border-t border-white/5 mt-16 py-8 text-center text-xs text-gray-500">
        <p>© 2026 Huy Cinema. Hệ thống xem phim trực tuyến chất lượng cao.</p>
    </footer>

    <script>
        const API_BASE = "/api";
        let currentPage = 1;
        let totalPages = 1;
        let currentCategory = 'all';
        let hls = null;
        let currentPlaying = null;
        let currentMovieDetail = null;
        let currentServers = [];
        let playerMode = 'm3u8';

        const categoryNames = {
            'all': 'Phim Mới Cập Nhật',
            'phim-bo': 'Phim Bộ Best-Seller',
            'phim-le': 'Phim Lẻ Chiếu Rạp',
            'hoat-hinh': 'Hoạt Hình Anime',
            'tv-shows': 'Chương Trình TV Shows'
        };

        function showSkeletons() {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = "";
            for (let i = 0; i < 10; i++) {
                grid.innerHTML += `
                    <div class="vip-card rounded-2xl overflow-hidden animate-skeleton">
                        <div class="aspect-[2/3] bg-white/[0.04]"></div>
                        <div class="p-3 space-y-2">
                            <div class="h-3.5 bg-white/10 rounded-full w-3/4"></div>
                            <div class="h-2.5 bg-white/5 rounded-full w-1/2"></div>
                        </div>
                    </div>
                `;
            }
        }

        function goHome() {
            document.getElementById('searchInput').value = "";
            closePlayer();
            selectCategory('all');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn vip-btn-secondary text-gray-300 px-4 py-2 rounded-full whitespace-nowrap shrink-0";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn vip-btn-primary text-white px-4 py-2 rounded-full whitespace-nowrap shrink-0";
            }
            loadMovies(1);
        }

        async function loadMovies(page) {
            currentPage = page;
            showSkeletons();
            document.getElementById('sectionTitle').innerText = categoryNames[currentCategory] || "Danh Sách Phim";
            document.getElementById('pagination').classList.remove('hidden');

            if (page === 1 && currentCategory === 'all') renderHistory();
            else document.getElementById('historySection').classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/movies?page=${page}&category=${currentCategory}`);
                const data = await res.json();
                
                if (data.status) {
                    totalPages = data.totalPages || 1;
                    document.getElementById('pageCurrent').innerText = `Trang ${currentPage} / ${totalPages}`;
                    renderMovies(data.items || []);

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    document.getElementById('prevBtn').disabled = (currentPage === 1);
                    document.getElementById('nextBtn').disabled = (currentPage >= totalPages);
                }
            } catch (err) {
                console.error("Lỗi lấy danh sách phim:", err);
            }
        }

        async function searchMovie() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) return;

            showSkeletons();
            document.getElementById('sectionTitle').innerText = `Kết quả tìm kiếm: "${keyword}"`;
            document.getElementById('pagination').classList.add('hidden');
            document.getElementById('historySection').classList.add('hidden');

            try {
                const res = await fetch(`${API_BASE}/search?keyword=${encodeURIComponent(keyword)}`);
                const data = await res.json();
                renderMovies(data.items || []);
            } catch (err) {
                console.error("Lỗi khi tìm kiếm:", err);
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchMovie();
        });

        function renderMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = "";

            if (!movies || movies.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12 text-sm font-medium">Không tìm thấy phim phù hợp.</p>`;
                return;
            }

            movies.forEach(item => {
                const card = document.createElement('div');
                card.className = "vip-card rounded-2xl overflow-hidden cursor-pointer group flex flex-col justify-between relative";
                card.onclick = () => watchMovie(item.slug);

                let displayEp = item.episode_current || 'Hoàn tất';

                card.innerHTML = `
                    <div>
                        <div class="relative aspect-[2/3] bg-black/40 overflow-hidden">
                            <img src="${item.thumb_url}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" onerror="this.onerror=null; this.src='https://placehold.co/300x400/121218/ffffff?text=No+Image'">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>

                            <div class="absolute top-2 left-2 right-2 flex flex-wrap gap-1.5 z-10">
                                <span class="bg-black/60 backdrop-blur-md border border-white/15 text-white text-[9px] sm:text-[10px] font-semibold px-2.5 py-0.5 rounded-full shadow-lg">
                                    ${displayEp}
                                </span>
                                <span class="bg-red-600/90 backdrop-blur-md border border-red-500/30 text-white text-[9px] sm:text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-lg">
                                    ${item.lang || 'Vietsub'}
                                </span>
                            </div>
                        </div>
                        <div class="p-2.5">
                            <h3 class="font-bold text-xs sm:text-sm line-clamp-1 group-hover:text-red-500 transition">${item.name}</h3>
                            <p class="text-[10px] sm:text-[11px] text-gray-400 mt-0.5 line-clamp-1">${item.origin_name || ''} (${item.year || 'N/A'})</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function watchMovie(slug, autoPlayEpName = null, activeServerIdx = 0) {
            try {
                const res = await fetch(`${API_BASE}/movie/${slug}`);
                const data = await res.json();
                
                if (!data.status) return alert("Không tìm thấy dữ liệu tập phim!");

                currentMovieDetail = data.movie;
                currentServers = data.servers || [];

                const playerSection = document.getElementById('playerSection');
                playerSection.classList.remove('hidden');
                playerSection.scrollIntoView({ behavior: 'smooth' });

                renderServerTabs(activeServerIdx, autoPlayEpName);
            } catch (err) {
                console.error("Lỗi xem phim:", err);
            }
        }

        function renderServerTabs(selectedServerIdx, autoPlayEpName = null) {
            const serverListContainer = document.getElementById('serverList');
            serverListContainer.innerHTML = "";

            if (currentServers.length === 0) {
                serverListContainer.innerHTML = "<p class='text-gray-400 text-xs'>Không tìm thấy nguồn phát khả dụng.</p>";
                return;
            }

            currentServers.forEach((srv, idx) => {
                const btn = document.createElement('button');
                const isActive = idx === selectedServerIdx;
                btn.className = `${isActive ? 'vip-btn-primary font-bold' : 'vip-btn-secondary'} text-white px-3.5 py-1.5 text-xs rounded-full whitespace-nowrap`;
                btn.innerText = srv.server_name;
                btn.onclick = () => renderServerTabs(idx, null);
                serverListContainer.appendChild(btn);
            });

            renderEpisodes(selectedServerIdx, autoPlayEpName);
        }

        function renderEpisodes(serverIdx, autoPlayEpName = null) {
            const epListContainer = document.getElementById('episodeList');
            epListContainer.innerHTML = "";

            const activeServer = currentServers[serverIdx];
            const episodes = activeServer ? activeServer.server_data : [];

            if (!episodes || episodes.length === 0) {
                epListContainer.innerHTML = "<p class='text-gray-400 text-xs'>Chưa có tập phim...</p>";
                return;
            }

            let targetEpisode = episodes[0];

            episodes.forEach((ep) => {
                const btn = document.createElement('button');
                const isTarget = autoPlayEpName ? (ep.name === autoPlayEpName) : false;
                
                btn.className = `${isTarget ? 'vip-btn-primary font-bold' : 'vip-btn-secondary'} text-white px-3 py-1 text-xs rounded-full min-w-[38px] ep-btn`;
                btn.innerText = ep.name;
                
                btn.onclick = () => {
                    document.querySelectorAll('.ep-btn').forEach(b => {
                        b.className = 'vip-btn-secondary text-white px-3 py-1 text-xs rounded-full min-w-[38px] ep-btn';
                    });
                    btn.className = 'vip-btn-primary font-bold text-white px-3 py-1 text-xs rounded-full min-w-[38px] ep-btn';
                    playVideo(ep, currentMovieDetail);
                };
                
                epListContainer.appendChild(btn);
                if (isTarget) targetEpisode = ep;
            });

            playVideo(targetEpisode, currentMovieDetail);
        }

        function playVideo(episodeObj, movieData) {
            if (!episodeObj.link_m3u8 && !episodeObj.link_embed) {
                alert("Tập phim này mới cập nhật, nguồn phát chưa sẵn sàng. Vui lòng chọn server khác!");
                return;
            }

            currentPlaying = {
                slug: movieData.slug,
                name: movieData.name,
                thumb_url: movieData.thumb_url,
                epName: episodeObj.name,
                url: episodeObj.link_m3u8,
                embed: episodeObj.link_embed
            };

            document.getElementById('playingTitle').innerText = `${movieData.name} - Tập ${episodeObj.name}`;

            if (playerMode === 'embed' || !episodeObj.link_m3u8) {
                loadEmbedPlayer(episodeObj.link_embed);
            } else {
                loadHlsPlayer(episodeObj.link_m3u8, episodeObj.link_embed);
            }
        }

        function loadHlsPlayer(m3u8Url, embedUrl) {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');
            
            iframe.classList.add('hidden');
            iframe.src = "";
            video.classList.remove('hidden');

            if (hls) { hls.destroy(); hls = null; }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(m3u8Url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) loadEmbedPlayer(embedUrl);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Url;
                video.play().catch(() => {});
            } else {
                loadEmbedPlayer(embedUrl);
            }
        }

        function loadEmbedPlayer(embedUrl) {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');

            video.pause();
            video.classList.add('hidden');
            if (hls) { hls.destroy(); hls = null; }

            iframe.classList.remove('hidden');
            iframe.src = embedUrl;

            document.getElementById('togglePlayerBtn').innerText = "Chế độ: Embed (Dự phòng)";
            playerMode = 'embed';
        }

        function togglePlayerMode() {
            if (!currentPlaying) return;
            if (playerMode === 'm3u8') {
                playerMode = 'embed';
                loadEmbedPlayer(currentPlaying.embed);
            } else {
                playerMode = 'm3u8';
                document.getElementById('togglePlayerBtn').innerText = "Chế độ: VIP Player (HLS)";
                loadHlsPlayer(currentPlaying.url, currentPlaying.embed);
            }
        }

        function getHistory() {
            return JSON.parse(localStorage.getItem('huy_cinema_history')) || [];
        }

        function saveHistoryItem(movie) {
            if (!movie) return;
            let history = getHistory();
            history = history.filter(h => !(h.slug === movie.slug && h.epName === movie.epName));
            history.unshift(movie);
            if (history.length > 10) history.pop();
            localStorage.setItem('huy_cinema_history', JSON.stringify(history));
        }

        function renderHistory() {
            const historySection = document.getElementById('historySection');
            const historyGrid = document.getElementById('historyGrid');
            const history = getHistory();

            if (history.length === 0) {
                historySection.classList.add('hidden');
                return;
            }

            historySection.classList.remove('hidden');
            historyGrid.innerHTML = "";

            history.forEach(item => {
                const card = document.createElement('div');
                card.className = "vip-card rounded-xl overflow-hidden cursor-pointer group flex-shrink-0 w-28 sm:w-36 snap-start";
                card.onclick = () => watchMovie(item.slug, item.epName);

                let epBadge = item.epName.toLowerCase().startsWith('tập') ? item.epName : `Tập ${item.epName}`;

                card.innerHTML = `
                    <div class="relative aspect-[2/3] bg-black/40">
                        <img src="${item.thumb_url}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/300x400/121218/ffffff?text=No+Image'">
                        <span class="absolute top-1 left-1 bg-red-600 text-[9px] px-1.5 py-0.5 rounded font-extrabold text-white shadow-md">${epBadge}</span>
                    </div>
                    <div class="p-2">
                        <h3 class="font-bold text-[11px] line-clamp-1 group-hover:text-red-500">${item.name}</h3>
                    </div>
                `;
                historyGrid.appendChild(card);
            });
        }

        function clearHistory() {
            localStorage.removeItem('huy_cinema_history');
            renderHistory();
        }

        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            const iframe = document.getElementById('iframePlayer');

            if (currentPlaying) saveHistoryItem(currentPlaying);

            video.pause();
            iframe.src = "";
            if (hls) { hls.destroy(); hls = null; }

            document.getElementById('playerSection').classList.add('hidden');
            currentPlaying = null;
            if (currentPage === 1 && currentCategory === 'all') renderHistory();
        }

        function changePage(step) {
            let targetPage = currentPage + step;
            if (targetPage < 1 || targetPage > totalPages) return;
            loadMovies(targetPage);
        }

        loadMovies(1);
    </script>
</body>
</html>
